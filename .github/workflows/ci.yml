name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной прогон полного набора тестов для ЛЮБОЙ ветки (cloud test run).
  # Запускает только проверки (staging-gate + ci); merge/deploy-* пропускаются,
  # потому что их условия требуют события pull_request или push в main.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка, которую тестируем'
        type: string
        default: main

jobs:
  staging-gate:
    name: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Check out domain skill siblings next to core (hh, sales, engineering, documents, speech, search, marketing)
        run: |
          for repo in trained-assist-hh-skill trained-assist-sales-skill trained-assist-documents-skill trained-assist-speech-skill trained-assist-search-skill trained-assist-marketing-skill; do
            git clone --quiet --depth 1 "https://github.com/trained-assist/$repo.git" "$GITHUB_WORKSPACE/../$repo"
          done
          # Repo renamed to software-engineering-playbooks; the sibling dir keeps the old name.
          git clone --quiet --depth 1 https://github.com/trained-assist/software-engineering-playbooks.git "$GITHUB_WORKSPACE/../trained-assist-engineering"
      - name: Install Chromium for response review scenario
        run: npx playwright install --with-deps chromium
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Verify recruiter domain with real nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python3 scripts/test-recruiter-nginx.py
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: warn

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check out domain skill siblings next to core (hh, sales, engineering, documents, speech, search, marketing)
        run: |
          for repo in trained-assist-hh-skill trained-assist-sales-skill trained-assist-documents-skill trained-assist-speech-skill trained-assist-search-skill trained-assist-marketing-skill; do
            git clone --quiet --depth 1 "https://github.com/trained-assist/$repo.git" "$GITHUB_WORKSPACE/../$repo"
          done
          # Repo renamed to software-engineering-playbooks; the sibling dir keeps the old name.
          git clone --quiet --depth 1 https://github.com/trained-assist/software-engineering-playbooks.git "$GITHUB_WORKSPACE/../trained-assist-engineering"
      - name: Syntax check
        run: npm run check
      - name: Testkit syntax check
        run: npm run check:testkit
      - name: Undefined-variable gate (eslint no-undef)
        run: npm run lint
      - name: Install Chromium for review page regression
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Agent isolation e2e with real unix users (issue #1649)
        run: |
          command -v setfacl >/dev/null || sudo apt-get install -y -qq acl
          AGENT_ISOLATION_E2E=1 node --test test/agent-isolation-e2e.test.cjs
      - name: Env-sync check
        run: node scripts/check-env-sync.js
      - name: Credential contract (declared ⊆ provided, no os.homedir() token paths)
        run: node scripts/check-credential-reachability.js
      - name: No direct connect-pending outside user-tokens.js
        run: |
          if grep -rn "connect-pending" src/ --include="*.js" | grep -v "src/user-tokens.js" | grep -v "src/server.js"; then
            echo "❌ Direct connect-pending usage found outside user-tokens.js — use generateConnectLink() or generateLegacyConnectLink() instead"
            exit 1
          fi
      - name: Recruiter/HH tools must call OpenRouter, not spawn Claude Code
        run: |
          FILES=$(find src/mcp-skills/tools -maxdepth 1 -type f \( -iname "*hh*.js" -o -iname "*recruiter*.js" \))
          if [ -n "$FILES" ] && echo "$FILES" | xargs grep -lE "require\((['\"]).*runner\1\)|spawn\(['\"]claude['\"]" ; then
            echo "❌ recruiter-quick-action MCP tools must call OpenRouter (DeepSeek/Gemini) via their own llmCall()-style helper, never open a Claude Code session — see README.md 'Recruiter/quick-action MCP tools must use cheap LLMs, never Claude Code'"
            exit 1
          fi
      - name: HH intent regexes must live in hh-skill src/hh-intents.js, not runner/intent-engine.js
        run: |
          if grep -nE "^const\s+\S*HH_\S*_INTENT\s*=" src/runner/intent-engine.js; then
            echo "❌ HH_*_INTENT definition found in src/runner/intent-engine.js — HH intents belong in trained-assist-hh-skill src/hh-intents.js, loaded via hhLib('hh-intents') (issue #942, #1470)"
            exit 1
          fi
      - name: server.js must not define inline HH functions (issue #942 P3.2)
        run: |
          if grep -nE '^\s*(async\s+)?function\s+\w*[Hh][Hh]\w*\s*\(' src/server.js | grep -vE '^[0-9]+:\s*(//|\*|/\*)'; then
            echo "❌ Inline HH function definition found in src/server.js — HH logic belongs in trained-assist-hh-skill (src/hh-routes.js), server.js is a router (issue #942 P3.1/P3.2)"
            exit 1
          fi
      - name: Per-profile paths must use src/data-paths.js (no legacy AGENT_DATA_DIR/sessions)
        run: |
          # Legacy per-profile storage (AGENT_DATA_DIR/sessions/<profile>) is deprecated —
          # resolve profile paths via src/data-paths.js (userWorkDir/sessionsDirPath).
          # See storage-paths-auth-refactor-spec.md §2 and scripts/migrate-workspaces.mjs.
          if grep -rnE "['\"]sessions['\"]\s*,\s*(USER_ID|String\(|username|profile)|dataDir\s*,\s*['\"]sessions['\"]" src/ --include="*.js"; then
            echo "❌ Legacy AGENT_DATA_DIR/sessions/<profile> path construction found — use src/data-paths.js helpers instead"
            exit 1
          fi

  coherence:
    needs: [ci]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR coherence check (informational, never blocks merge)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: main
        run: node scripts/pr-coherence-check.mjs

  per-file-coherence:
    needs: [ci]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Per-file coherence check (informational, never blocks merge)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: main
        run: node scripts/pr-per-file-coherence.mjs

  autofix:
    needs: [ci, staging-gate, merge]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (
        needs.ci.result == 'failure' ||
        needs.staging-gate.result == 'failure' ||
        needs.merge.result == 'failure'
      ) &&
      !startsWith(github.head_ref, 'fix/ci-')
    permissions:
      contents: write
      pull-requests: write
    uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@v1.7.3
    with:
      pr_number: ${{ github.event.pull_request.number }}
      original_branch: ${{ github.head_ref }}
      # When merge failed but CI passed — batch mode (skips CI log, goes straight to git merge)
      run_id: ${{ (needs.merge.result == 'failure' && needs.ci.result == 'success' && needs.staging-gate.result == 'success') && '0' || github.run_id }}
    secrets:
      llm_ladder_token: ${{ secrets.LLM_LADDER_TOKEN }}
      gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}

  merge:
    needs: [ci, staging-gate]
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Squash-merge the PR
        id: merge
        run: |
          # Retry loop: GitHub branch-protection status checks can lag a few
          # seconds behind job completion ("N of N required status checks are
          # expected"). Regressed once already (silently lost between #965 and
          # #943) — fix/ci-* branches are exempt from autofix re-trigger, so
          # if this merge fails outright they hang forever with no recovery.
          for i in 1 2 3 4 5; do
            OUTPUT=$(gh pr merge --squash --match-head-commit "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.html_url }}" 2>&1) && EXIT=0 || EXIT=$?
            echo "$OUTPUT"
            [ $EXIT -eq 0 ] && break
            # Staleness by merge state, not by error text: newer gh reports a behind
            # branch as "the base branch policy prohibits the merge", which the old
            # grep missed → 5 retries → autofix re-created the PR (#1663 → #1665).
            STATE=$(gh pr view "${{ github.event.pull_request.html_url }}" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            echo "mergeStateStatus=$STATE"
            if [ "$STATE" = "BEHIND" ] || echo "$OUTPUT" | grep -q "not up to date with the base branch"; then
              echo "Branch is behind main — updating it in place to trigger a fresh CI run on this PR..."
              # Conflicts → fail the job so autofix resolves them (exit 0 here used to skip autofix).
              gh pr update-branch "${{ github.event.pull_request.html_url }}" && { echo "Branch updated."; exit 0; }
              echo "update-branch failed (likely a conflict) — leaving it to autofix"; exit 1
            fi
            [ "$STATE" = "DIRTY" ] && { echo "Merge conflict with main — leaving it to autofix"; exit 1; }
            echo "Merge attempt $i failed, retrying in 15s..."
            sleep 15
          done
          [ $EXIT -eq 0 ] && echo "sha=$(gh pr view '${{ github.event.pull_request.html_url }}' --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
          exit $EXIT
        env:
          # A commit pushed with the default GITHUB_TOKEN can't trigger a new
          # workflow run (GitHub's recursion guard) — the synchronize event it
          # fires lands stuck in "action_required" with zero jobs, so the
          # update-branch recovery above never gets a fresh CI run and the PR
          # hangs forever. Use a real PAT so the resulting run executes normally.
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

  # Runs after PR auto-merge OR on direct push to main (e.g. GitHub UI squash-merge).
  # always() lets the job run even when `merge` was skipped (merge only runs on PRs).
  deploy-gcp:
    needs: [ci, staging-gate, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success' &&
      !contains(github.event.pull_request.title || github.event.head_commit.message, '[nginx-only]') &&
      (needs.merge.outputs.sha != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gcp
      cancel-in-progress: false
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ needs.merge.outputs.sha || github.sha }}"
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            # Deploy code is taken from the target commit, not the (possibly dirty)
            # session worktree: run it from a throwaway archive of the SHA. Prod is
            # built into ~/agent-releases/<sha> and served via ~/agent-master, so
            # this worktree is only a git source — no checkout/reset here (#1391).
            DEPLOY_TMP=$(mktemp -d)
            git archive "$DEPLOY_TARGET_COMMIT" scripts | tar -x -C "$DEPLOY_TMP"
            REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-preflight.sh" "$DEPLOY_TARGET_COMMIT"
            printf 'AGENT_SECRET=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\nGITHUB_ISSUES_TOKEN=%s\nCHECKLIST_API_KEY=%s\nOPENCODE_MODEL=%s\nOPENCODE_PROFILE=%s\nCRED_ENCRYPTION_KEY=%s\nSERPER_API_KEY=%s\nSALES_BOT_TOKEN=%s\n' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              '${{ secrets.ISSUES_PIPELINE_TOKEN }}' \
              '${{ secrets.CHECKLIST_API_KEY }}' \
              '' \
              '${{ secrets.OPENCODE_PROFILE }}' \
              '${{ secrets.CRED_ENCRYPTION_KEY }}' \
              '${{ secrets.SERPER_API_KEY }}' \
              '${{ secrets.SALES_BOT_TOKEN }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node "$DEPLOY_TMP/scripts/register-hook.js"
            DEPLOY_ENV=gcp REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy.sh"
            # Epic #1342/#1885: the bot-token probe used to run HERE — after deploy.sh had
            # already swapped ~/agent-master and restarted. A bot whose token cannot be
            # loaded therefore went live first and only turned the job red afterwards
            # (a383f63, 01.10.2026: SALES_BOT_TOKEN). The check moved INTO deploy.sh, which
            # runs scripts/check-deploy-secrets-gate.js before the release is activated, so a
            # red guard now leaves the previous release serving. One place, not two.
            rm -rf "$DEPLOY_TMP"

  deploy-ru:
    needs: [ci, staging-gate, merge]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.staging-gate.result == 'success' &&
      !contains(github.event.pull_request.title || github.event.head_commit.message, '[nginx-only]') &&
      (needs.merge.outputs.sha != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ru
      cancel-in-progress: false
    steps:
      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ needs.merge.outputs.sha || github.sha }}"
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            DEPLOY_TMP=$(mktemp -d)
            git archive "$DEPLOY_TARGET_COMMIT" scripts | tar -x -C "$DEPLOY_TMP"
            REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-preflight.sh" "$DEPLOY_TARGET_COMMIT"
            # ru-edge (src/ru-edge.js, issue #1288) has no Claude Code, no runner,
            # no MCP — only TELEGRAM_BOT_TOKEN (Telegram notifications) and
            # AGENT_SECRET (auth gate + calling GCP back) are required.
            printf 'TELEGRAM_BOT_TOKEN=%s\nAGENT_SECRET=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.AGENT_SECRET }}' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" DEPLOY_ENV=ru REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-ru-edge.sh"
            rm -rf "$DEPLOY_TMP"

  notify-merge-queue:
    needs: [deploy-gcp, deploy-ru]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-gcp.result == 'success' &&
      needs.deploy-ru.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify merge-queue — deploy complete
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.MERGE_QUEUE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Deploy-Playbooks/merge-queue/dispatches \
            -d '{
              "event_type": "deploy_completed",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "base_branch": "main"
              }
            }'
