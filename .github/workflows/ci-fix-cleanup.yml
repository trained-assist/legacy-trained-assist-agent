# Managed by the trained-assist-engineering pr-autofix service.
# Cleanup for trained-assist/trained-assist-agent — change the service registration, not this file.
# Delegates to the pinned pr-autofix cleanup callable when a PR closes.
name: CI Fix Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@v1.7.8
    secrets:
      gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}
