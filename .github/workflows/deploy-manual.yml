name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - gcp
          - ru
      reason:
        description: 'Why are you deploying manually? (for the audit log)'
        required: false
        type: string

jobs:
  staging-gate:
    name: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: warn

  deploy-gcp:
    needs: staging-gate
    if: inputs.target == 'gcp' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            echo "==> Manual deploy triggered by ${{ github.actor }}. Reason: ${{ inputs.reason || 'not specified' }}"
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ github.sha }}"
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            DEPLOY_TMP=$(mktemp -d)
            git archive "$DEPLOY_TARGET_COMMIT" scripts | tar -x -C "$DEPLOY_TMP"
            REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-preflight.sh" "$DEPLOY_TARGET_COMMIT"
            printf 'AGENT_SECRET=%s\nINN_DADATA_TOKEN=%s\nINN_DADATA_SECRET=%s\nINN_CHECKO_KEY=%s\nOPENAI_API_KEY=%s\nFAL_KEY=%s\nIDEOGRAM_API_KEY=%s\nRECRAFT_API_KEY=%s\nOPENROUTER_API_KEY=%s\nZEROCREDS_ADMIN_TOKEN=%s\nGITHUB_ISSUES_TOKEN=%s\nOPENCODE_MODEL=%s\nOPENCODE_PROFILE=%s\n' \
              '${{ secrets.AGENT_SECRET }}' \
              '${{ secrets.INN_DADATA_TOKEN }}' \
              '${{ secrets.INN_DADATA_SECRET }}' \
              '${{ secrets.INN_CHECKO_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.FAL_KEY }}' \
              '${{ secrets.IDEOGRAM_API_KEY }}' \
              '${{ secrets.RECRAFT_API_KEY }}' \
              '${{ secrets.OPENROUTER_API_KEY }}' \
              '${{ secrets.ZEROCREDS_ADMIN_TOKEN }}' \
              '${{ secrets.ISSUES_PIPELINE_TOKEN }}' \
              '' \
              '' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            node "$DEPLOY_TMP/scripts/register-hook.js"
            FORCE_DEPLOY=1 DEPLOY_ENV=gcp REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy.sh"
            rm -rf "$DEPLOY_TMP"

  deploy-ru:
    needs: staging-gate
    if: inputs.target == 'ru' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to RU VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_RU_HOST }}
          username: ${{ secrets.VM_RU_USER }}
          password: ${{ secrets.VM_RU_PASSWORD }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            exec 9>"$HOME/.assist-deploy.lock"
            flock -n 9 || { echo "Another deploy owns the lock"; exit 1; }
            export ASSIST_DEPLOY_LOCKED=1
            echo "==> Manual deploy triggered by ${{ github.actor }}. Reason: ${{ inputs.reason || 'not specified' }}"
            git config --global --add safe.directory /home/vova/trained-assist-agent
            cd /home/vova/trained-assist-agent
            git fetch origin "${{ github.sha }}"
            export DEPLOY_TARGET_COMMIT=$(git rev-parse FETCH_HEAD)
            DEPLOY_TMP=$(mktemp -d)
            git archive "$DEPLOY_TARGET_COMMIT" scripts | tar -x -C "$DEPLOY_TMP"
            REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-preflight.sh" "$DEPLOY_TARGET_COMMIT"
            # ru-edge (src/ru-edge.js, issue #1288) has no Claude Code, no runner,
            # no MCP — only TELEGRAM_BOT_TOKEN and AGENT_SECRET are required.
            printf 'TELEGRAM_BOT_TOKEN=%s\nAGENT_SECRET=%s\nAGENT_PUBLIC_URL=%s\n' \
              '${{ secrets.TELEGRAM_BOT_TOKEN }}' \
              '${{ secrets.AGENT_SECRET }}' \
              'https://platform.recruiter-assistant.ru' \
              > /home/vova/secrets.env
            chmod 600 /home/vova/secrets.env
            AGENT_SECRET="${{ secrets.AGENT_SECRET }}" DEPLOY_ENV=ru REPO_DIR=/home/vova/trained-assist-agent bash "$DEPLOY_TMP/scripts/deploy-ru-edge.sh"
            rm -rf "$DEPLOY_TMP"

  notify-merge-queue:
    needs: [deploy-gcp, deploy-ru]
    if: |
      always() &&
      (needs.deploy-gcp.result == 'success' || needs.deploy-gcp.result == 'skipped') &&
      (needs.deploy-ru.result == 'success' || needs.deploy-ru.result == 'skipped') &&
      (needs.deploy-gcp.result == 'success' || needs.deploy-ru.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Notify merge-queue — deploy complete
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.MERGE_QUEUE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Deploy-Playbooks/merge-queue/dispatches \
            -d '{
              "event_type": "deploy_completed",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "base_branch": "main"
              }
            }'
