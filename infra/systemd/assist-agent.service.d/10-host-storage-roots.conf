# assist-agent — host drop-in: canonical storage roots (epic #1789 P1).
#
# A NEW VM must boot from code, not from hand-edited /etc state: this file is
# the repo-side source for the machine-local part of the service unit.
# scripts/setup.sh installs it (see the same directory's README.md for the
# manual install / rollback commands). Nothing else writes this file.
#
# Why a drop-in: systemd/assist-agent.service is the unit shared by every VM,
# while paths and the engine run-as pool are per-machine. Keeping them in
# /etc/systemd/system/<unit>.service.d/ means `systemctl cat assist-agent`
# shows both layers, a repo update never clobbers host values, and a new box
# needs no manual editing.
#
# ── Storage roots — resolved by src/data-paths.js, never hardcoded in code ──
# AGENT_DATA_DIR    = SYSTEM_ROOT: server-side operational state — pending-task
#                     journal (pending-tasks/), durable-task SQLite, execution
#                     history, engine health, system flags.
# USERS_DIR         = USERS_ROOT: per-profile workspaces (sessions, projects,
#                     contexts, engineering workspaces). The engine's cwd.
# AGENT_TOKENS_DIR  = TOKENS_ROOT: per-profile credentials, one file per
#                     service, mode 0600.
# The base unit already sets the same defaults (they are restated here so this
# host file is the single place to override them — keep the two in sync, or
# drop the base unit's copy once every VM installs this drop-in).
#
# ── Other per-host values, documented for the operator ──────────────────────
# AGENT_PUBLIC_URL / HH_PLATFORM_URL / RU_EDGE_URL / VACANCY_REMOTE_STORE_URL
#                     public base URLs — set in the base unit, override here
#                     when the box has its own domain/IP.
# VM_NAME            = identity shown in /health ("gcp-main", "ru-vm").
# PORT               = HTTP listen port (8080 behind nginx).
# NODE_ENV           = production.
# MAX_CONCURRENT_TASKS = cap on live engine processes (src/runner/task-queue.js).
# ENGINE_UNAVAILABLE_AFTER_FAILURES = before engine health flips to unavailable
#                     (src/engine-health.js); unset = default 3.
# ── Engine isolation (#1649) — deliberately NOT enabled here ────────────────
# AGENT_RUN_AS_USERS / AGENT_RUN_AS_GROUP / AGENT_SERVICE_USER — the pool of
#   unprivileged unix users ("slots") each engine run leases. AGENT_ENV_ALLOWLIST
#   =1 — engine env from an allowlist + MCP run-token bridge (docs/agent-process-isolation.md).
#   Enabling either before the slot users exist makes EVERY engine run fail at
#   `sudo -n -u <slot>` (the service boots fine, nothing runs). They are
#   produced by scripts/ops/agent-isolation-setup.sh, which creates the users,
#   the sudoers rule and the ACLs first and then writes its own drop-in:
#     /etc/systemd/system/assist-agent.service.d/agent-isolation.conf
#   To turn isolation on a machine: run that script, don't hand-edit this file.

[Service]
Environment=AGENT_DATA_DIR=/home/vova/agent-data
Environment=USERS_DIR=/home/vova/users
Environment=AGENT_TOKENS_DIR=/home/vova/agent-tokens
