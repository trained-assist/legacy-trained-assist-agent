# assist-agent — host identity: contabo-vm2 (Contabo, France — EU).
#
# The second agent host (issue #2114 P0.2/P0.3, epic #1789 P5). Installed as
# /etc/systemd/system/assist-agent.service.d/20-host-identity.conf by
#   scripts/ops/install-host-config.sh contabo-vm2
# One file per host under infra/systemd/host/ — the repo is the single source of
# a box's identity, public origins and role, so a fresh /etc never disagrees with
# what the code documents (infra/env-manifest.json → vms.contabo-vm2).
#
# ── Identity ──────────────────────────────────────────────────────────────────
# VM_NAME — what /health reports and what execution-owner/health logs key on.
# Before this file existed the shared base unit said `gcp-main` and only this
# drop-in corrected it: two keys with one meaning, and dropping the drop-in
# silently renamed the box.
Environment=VM_NAME=contabo-vm2

# ── Public origins: this box's own door, never the dying GCP one ─────────────
# AGENT_PUBLIC_URL is the origin every generated link uses (connect-links,
# instant-publish, HH pages). Trap #1 of #2114: these pointed at
# 136-65-7-197.sslip.io, so anything generated HERE led to the machine being shut
# down. The door is nginx + certbot on 169-58-15-230.sslip.io (infra/nginx/agent-vm2.conf).
Environment=AGENT_PUBLIC_URL=https://169-58-15-230.sslip.io/agent
Environment=HH_PLATFORM_URL=https://169-58-15-230.sslip.io/agent

# ── Fleet role ────────────────────────────────────────────────────────────────
# Exactly one host in the fleet may tick crons (#2114 trap #6: two `primary`
# hosts run every cron job twice). GCP holds the role until P2 moves profiles;
# VM2 stays off so nothing double-fires while it is only the MCP host.
Environment=CRON_SCHEDULER_ROLE=off

# ── Capacity ──────────────────────────────────────────────────────────────────
# 4 vCPU / 7 GB RAM (vs 4 vCPU / 16 GB on gcp-main). Engines are network-bound
# but memory-hungry (~0.6 GB each), so GCP's fleet-wide 12 would OOM this box
# before the queue ever filled. Sized for the RAM, not copied from the base unit.
Environment=MAX_CONCURRENT_TASKS=4