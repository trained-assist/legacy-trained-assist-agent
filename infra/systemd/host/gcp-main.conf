# assist-agent — host identity: gcp-main (GCP us-central1, Council Bluffs).
#
# Installed as /etc/systemd/system/assist-agent.service.d/20-host-identity.conf by
#   scripts/ops/install-host-config.sh gcp-main
# The values here are byte-identical to what the shared base unit used to carry
# (commit 422872e), so installing this file changed nothing on a live box — it
# only gave those values a second, per-host home. That had to happen BEFORE
# `systemd/assist-agent.service` stopped carrying them, otherwise a deploy would
# have handed gcp-main VM2's public URLs (#2114 P0.3).
#
# ── Identity ──────────────────────────────────────────────────────────────────
# [Service] is load-bearing — a drop-in without a section header is applied outside
# any section and systemd ignores every line in it (see contabo-vm2.conf).
[Service]
Environment=VM_NAME=gcp-main

# ── Public origins: the machine origin, NOT the branded domain ────────────────
# recruiter-assistant.ru falls through to the RU edge, which 401s
# /connect/* — a Google OAuth redirect_uri pointed there breaks the login.
Environment=AGENT_PUBLIC_URL=https://136-65-7-197.sslip.io/agent
Environment=HH_PLATFORM_URL=https://136-65-7-197.sslip.io/agent

# ── Fleet role ────────────────────────────────────────────────────────────────
# This host owns the canonical cron SQLite and ticks it (assist-cron-tick.timer).
Environment=CRON_SCHEDULER_ROLE=primary

# ── Capacity ──────────────────────────────────────────────────────────────────
# 4 vCPU / 16 GB RAM. 12 concurrent engines measured 2026-09-28; the run-as slot
# pool (14) stays >= this + nested runs.
Environment=MAX_CONCURRENT_TASKS=12