# RU VM only. Exhibition catalogs on <event_key>.sales-manager-assistant.ru.
#
# Why nginx and not a Cloudflare Worker: site_deploy already mirrors every
# deployed folder into <AGENT_DATA_DIR>/sites/<project>/ and the GCP server
# serves that at /s/<project>/ (src/site-mirror.js). All this file does is map
# the subdomain onto that path. A new exhibition therefore needs no DNS record,
# no custom domain in the Cloudflare dashboard and no code change — the wildcard
# record and the wildcard certificate are provisioned once, and every later
# exhibition works because its subdomain IS its eventKey.
#
# Install:
#   1. Cloudflare DNS, both records DNS-only (grey cloud), A → 178.212.14.192:
#        sales-manager-assistant.ru        A 178.212.14.192
#        *.sales-manager-assistant.ru      A 178.212.14.192
#      DNS-only keeps this file the single TLS terminator. Do NOT attach the
#      apex as a Worker custom domain — Cloudflare would then serve the apex
#      and this file would only ever see the subdomains.
#   2. Certificate with SAN sales-manager-assistant.ru + *.sales-manager-assistant.ru
#      at /etc/letsencrypt/live/sales-manager-assistant.ru/
#   3. DEPLOY_ENV=ru DEPLOY_SALES_APEX=1 bash scripts/deploy-nginx.sh
#   4. curl --resolve rosupack2026.sales-manager-assistant.ru:443:178.212.14.192 \
#        https://rosupack2026.sales-manager-assistant.ru/s/rosupack2026/
#
# The Notes API is NOT bound here: catalogs call it cross-origin at
# flexi-site-notes.skillset-apply.workers.dev, and its allowlist takes the
# wildcard *.sales-manager-assistant.ru (see flexi-crm-automation).

# ── port 80: ACME + canonical scheme ──────────────────────────────────────────────
server {
    listen 80;
    server_name sales-manager-assistant.ru *.sales-manager-assistant.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # $host keeps the subdomain; $request_uri keeps path and query byte-for-byte.
    location / { return 308 https://$host$request_uri; }
}

# ── apex ─────────────────────────────────────────────────────────────────────────
# Path form /s/<expo>/ works here too, as a fallback for links that were built
# before the subdomain scheme existed. Deliberately NO /web/, /hh/*, /connect/hh:
# those belong to the recruiting web app on recruiter-assistant.ru and must not
# be reachable through the sales domain.
server {
    listen 443 ssl;
    server_name sales-manager-assistant.ru;

    ssl_certificate /etc/letsencrypt/live/sales-manager-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-manager-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location ^~ /p/ {
        proxy_pass https://136-65-7-197.sslip.io/agent/p/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    # Branded copies of site_deploy folders (src/site-mirror.js) live on GCP too.
    location ^~ /s/ {
        proxy_pass https://136-65-7-197.sslip.io/agent/s/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    # No site is published at the root and nothing else belongs on this host.
    location / {
        default_type text/plain;
        return 404 "sales-manager-assistant.ru serves catalogs on <event_key>.sales-manager-assistant.ru\n";
    }
}

# ── <event_key>.sales-manager-assistant.ru ───────────────────────────────────────
# The subdomain is the eventKey, so the mirror namespace on GCP is addressed
# directly: /agent/s/<eventKey>/. The regex mirrors NAME_RE in site-mirror.js
# exactly — leading alnum, optional middle, trailing alnum, 1..58 chars — so a
# name the mirror would accept is never rejected here and vice versa. Quoted
# because nginx reads an unquoted `{` as a block delimiter and NAME_RE has
# `{0,56}` inside. Both facts are pinned by scripts/test-sales-nginx.py.
server {
    # Quoted: nginx parses an unquoted `{` as a block delimiter, and NAME_RE's
    # `{0,56}` would break the config. Verified by scripts/test-sales-nginx.py.
    listen 443 ssl;
    server_name "~^(?<expo>[a-z0-9](?:[a-z0-9-]{0,56}[a-z0-9])?)\.sales-manager-assistant\.ru$";

    ssl_certificate /etc/letsencrypt/live/sales-manager-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-manager-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # proxy_pass carries variables, so nginx does NOT strip the matched prefix —
    # the full URI is spelled out: /agent/s/<eventKey> + the original request URI
    # (path and query byte-for-byte).
    location / {
        proxy_pass https://136-65-7-197.sslip.io/agent/s/$expo$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }
}