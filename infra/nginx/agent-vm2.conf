# VM2 (Contabo, France) — the public door of the agent host that replaces GCP (issue #2114 P0.1).
#
# Same shape as GCP's relay site (infra/nginx/relay.conf), minus everything this
# box does not run: no token-relay :8081, no zen-relay :8789, no anthropic/telegram
# proxies, no /browser/ (no chrome/xvfb/noVNC on VM2 yet — see docs/mcp-http-door.md
# "what the door does not expose").
#
# Hostname: the IP-shaped sslip.io name of this box, TLS from certbot. The
# branded agent.trainedassist.store stays on GCP until P2 moves the consumers —
# this site is deliberately a DIFFERENT origin so nothing is switched by accident.
#
# Timeouts. The JSON-RPC door is the slow one: a tools/call runs a real skill
# (video_analyze_batch ~120 s, an LLM call, a browser step). GCP's relay site
# inherits nginx's 60 s default for everything outside /agent/, which is exactly
# how a remote engine ends up calling the door and getting an empty 504. Every
# agent route here reads for 300 s, and /agent/ additionally matches the 20 MiB
# intake limit. Uncommented diff from relay.conf is deliberate; keep it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name 169-58-15-230.sslip.io;

    # Everything that lands on the agent, not only /agent/. A consumer configured
    # with base `https://169-58-15-230.sslip.io/agent` reaches /agent/mcp, but one
    # that uses the bare origin reaches /mcp — both must work identically.
    location /agent/ {
        # Match the agent durable intake store (20 MiB); nginx defaults to 1 MiB.
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # MCP JSON-RPC and long tools: streaming off (a streamed tools/call body
        # must arrive in one piece), 300 s instead of the 60 s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # The door itself, on the bare origin — where a remote engine host points.
    location = /mcp {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Minting a run token: same timeout budget, it is a boot-time call.
    location = /mcp/token {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Workload Identity Federation issuer (#2114 P0.6) ────────────────────────
    # The GCS session archive needs bucket access from this box, and the project's
    # org policy `iam.disableServiceAccountKeyCreation` forbids SA keys — so the
    # credential is federated, not keyed: a local issuer (systemd wif-oidc, 127.0.0.1:18080)
    # signs the subject token and Google STS verifies it against this JWKS.
    #
    # STS fetches issuer metadata and JWKS from the public internet. The subject-token
    # endpoint is different: it mints a signed credential and is intentionally only
    # available to the local ADC client at 127.0.0.1:18080. Never proxy /token publicly.
    # Keep public metadata in THIS server block rather than a second one with the same
    # server_name — nginx would silently keep only the first block and return 404.
    location = /.well-known/openid-configuration { proxy_pass http://127.0.0.1:18080; }
    location = /.well-known/jwks.json            { proxy_pass http://127.0.0.1:18080; }
    location = /token                            { return 404; }

    # Liveness of the box itself (no auth) — the gate for "is VM2 an MCP host yet".
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Credential + ZeroCreds form endpoints a migrated profile needs.
    location /tokens {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /connect/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # POST /connect/nalog-style interactive logins block for a minute or more.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location /hh-callback {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # HH pages + ATS editor live under the same origin as the links VM2 mints.
    location /hh/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/169-58-15-230.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/169-58-15-230.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = 169-58-15-230.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 169-58-15-230.sslip.io;
    return 404; # managed by Certbot
}
