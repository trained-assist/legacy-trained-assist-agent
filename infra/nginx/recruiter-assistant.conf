# RU VM only. Install after provisioning the apex + www certificate.
# Keep platform.recruiter-assistant.ru unchanged for existing links.
server {
    listen 80;
    server_name recruiter-assistant.ru www.recruiter-assistant.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / { return 308 https://recruiter-assistant.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.recruiter-assistant.ru;
    ssl_certificate /etc/letsencrypt/live/recruiter-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruiter-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://recruiter-assistant.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name recruiter-assistant.ru;
    ssl_certificate /etc/letsencrypt/live/recruiter-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruiter-assistant.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location = / { return 302 /web/$is_args$args; }

    # OAuth state belongs to the existing GCP process. Route both start and
    # callback there, preserving every parameter and the registered redirect URI.
    location = /connect/hh {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }
    location ^~ /connect/hh/ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }
    location = /hh-callback {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        return 307 https://136-65-7-197.sslip.io$request_uri;
    }

    # Cold-search data and credentials remain on GCP. Keep page and API on
    # one browser origin; never redirect signed links to the infrastructure host.
    # Published reports are stored by the GCP publishing service as well.
    location ^~ /p/ {
        proxy_pass https://136-65-7-197.sslip.io/agent/p/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    # Branded copies of site_deploy folders (src/site-mirror.js) live on GCP too.
    location ^~ /s/ {
        proxy_pass https://136-65-7-197.sslip.io/agent/s/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    # Existing entries are immutable (signed links in bot messages). Added by the
    # recruiting web hub (#1742/#1743): vacancies/plan/playbook-run (new pages),
    # ats-editor/style/sync-log (were falling through to ru-edge and 401'd).
    # Portrait epic (trained-assist-hh-skill#83): vacancy-new (портрет+донут),
    # candidate-new/candidate-doc/candidate-docs/candidate-photo (документы кандидата),
    # candidate-report(.pdf) (два документа, MD/PDF по кнопке), eval-run (async-оценка),
    # portrait/portrait-file (сборка портрета). Без этого списка страницы 404 на проде.
    location ~ ^/hh/(review|candidate|sync-negotiations|response-state|response-updates|send|reject|send-and-reject|generate-message|ats-editor|style|sync-log|vacancies|plan|playbook-run|vacancy-new|candidate-new|candidate-report|candidate-report\.pdf|candidate-photo|eval-run|portrait|portrait-file|candidate-doc|candidate-docs)$ {
        rewrite ^/hh/(.*)$ /agent/hh/$1 break;
        proxy_pass https://136-65-7-197.sslip.io;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    location = /hh/proactive {
        proxy_pass https://136-65-7-197.sslip.io/agent/hh/proactive;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    location ^~ /api/hh/proactive/ {
        proxy_pass https://136-65-7-197.sslip.io/agent/api/hh/proactive/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host 136-65-7-197.sslip.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
